<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Face Attendance System</title>
<style>
    body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 20px;
        background: linear-gradient(135deg, #ff7e5f 0%, #feb47b 50%, #ff6ec7 100%);
        min-height: 100vh;
    }
    .container {
        max-width: 1200px;
        margin: 0 auto;
        background: #fff;
        padding: 30px;
        border-radius: 12px;
        box-shadow: 0 8px 20px rgba(0,0,0,0.1);
    }
    .header {
        text-align: center;
        margin-bottom: 30px;
    }
    .header h1 {
        font-size: 2.5rem;
        color: #111827;
    }
    .header p {
        font-size: 1.2rem;
        color: #6b7280;
    }
    .status {
        background: #e0f7fa;
        padding: 20px;
        border-radius: 10px;
        margin-bottom: 30px;
        box-shadow: inset 0 0 10px rgba(0,0,0,0.05);
    }
    .video-container {
        display: flex;
        gap: 30px;
        flex-wrap: wrap;
        margin-bottom: 30px;
    }
    .video-section, .attendance-section {
        flex: 1;
        min-width: 300px;
    }
    .video-section img {
        width: 100%;
        border-radius: 10px;
        border: 2px solid #ddd;
        box-shadow: 0 4px 15px rgba(0,0,0,0.05);
    }
    .attendance-list {
        max-height: 400px;
        overflow-y: auto;
        border: 1px solid #ddd;
        border-radius: 10px;
        padding: 10px;
        background: #f9fafb;
    }
    .attendance-item {
        padding: 10px 15px;
        border-bottom: 1px solid #eee;
        display: flex;
        justify-content: space-between;
        transition: all 0.2s;
    }
    .attendance-item:last-child {
        border-bottom: none;
    }
    .attendance-item:hover {
        background: #e0f2fe;
        transform: translateX(5px);
    }
    .controls {
        text-align: center;
        margin-top: 20px;
    }
    button {
        background: #3b82f6;
        color: #fff;
        border: none;
        padding: 12px 25px;
        border-radius: 50px;
        cursor: pointer;
        margin: 0 10px;
        font-weight: 600;
        transition: all 0.3s ease;
    }
    button:hover {
        background: #2563eb;
        transform: translateY(-2px);
    }
    .attendance-list::-webkit-scrollbar {
        width: 8px;
    }
    .attendance-list::-webkit-scrollbar-thumb {
        background: #3b82f6;
        border-radius: 10px;
    }
    .attendance-list::-webkit-scrollbar-track {
        background: #e5e7eb;
    }
    .toast {
        position: fixed;
        top: 16px;
        right: 16px;
        background: #fee2e2;
        color: #991b1b;
        border: 1px solid #fecaca;
        padding: 10px 14px;
        border-radius: 8px;
        box-shadow: 0 4px 16px rgba(0,0,0,0.1);
        font-weight: 600;
        z-index: 1000;
        display: none;
    }
</style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>🎯 Face Attendance System</h1>
        <p>Real-time face recognition and attendance tracking</p>
    </div>

    <div class="status" id="status">
        <h3>System Status</h3>
        <p>Loading...</p>
    </div>

    <div class="video-container">
        <div class="video-section">
            <h3>Live Camera Feed</h3>
            <img src="{{ url_for('video_feed') }}" alt="Video Feed">
        </div>
        <div class="attendance-section">
            <h3>Today's Attendance</h3>
            <div class="attendance-list" id="attendanceList">
                <p>No attendance records yet...</p>
            </div>
        </div>
    </div>

    <div class="controls">
        <button onclick="refreshAttendance()">Refresh Attendance</button>
        <button onclick="downloadCSV()">Download CSV</button>
        <button style="background:#ef4444" onclick="clearAttendance()">Clear Attendance</button>
    </div>
</div>

<script>
async function updateStatus() {
    try {
        const response = await fetch('/status');
        const data = await response.json();
        document.getElementById('status').innerHTML = `
            <h3>System Status</h3>
            <p><strong>Loaded Faces:</strong> ${data.loaded_faces}</p>
            <p><strong>Face Names:</strong> ${data.face_names.join(', ')}</p>
            <p><strong>Total Attendance Records:</strong> ${data.total_attendance}</p>
        `;
        if (data.notice) {
            showToast(data.notice);
        }
    } catch(err) {
        console.error('Error fetching status:', err);
    }
}

async function updateAttendance() {
    try {
        const response = await fetch('/attendance');
        const data = await response.json();
        const list = document.getElementById('attendanceList');
        if(data.length === 0) {
            list.innerHTML = '<p>No attendance records yet...</p>';
            return;
        }
        list.innerHTML = data.map(item => `
            <div class="attendance-item">
                <span><strong>${item.name}</strong></span>
                <span>
                    <strong>In:</strong> ${item.punch_in || '-'}
                    &nbsp; | &nbsp;
                    <strong>Out:</strong> ${item.punch_out || '-'}
                </span>
            </div>
        `).join('');
    } catch(err) {
        console.error('Error fetching attendance:', err);
    }
}

function refreshAttendance() {
    updateAttendance();
    updateStatus();
}

function downloadCSV() {
    window.open('/download', '_blank');
}

async function clearAttendance() {
    if(!confirm('Are you sure you want to clear all attendance?')) return;
    try {
        const res = await fetch('/clear_attendance', { method: 'POST' });
        const data = await res.json();
        alert(data.message || 'Cleared');
        refreshAttendance();
    } catch(err) {
        console.error('Error clearing attendance:', err);
        alert('Failed to clear attendance');
    }
}

function showToast(message) {
    let toast = document.getElementById('globalToast');
    if (!toast) {
        toast = document.createElement('div');
        toast.id = 'globalToast';
        toast.className = 'toast';
        document.body.appendChild(toast);
    }
    toast.textContent = message;
    toast.style.display = 'block';
    clearTimeout(window.__toastTimer);
    window.__toastTimer = setTimeout(() => {
        toast.style.display = 'none';
    }, 5000);
}

setInterval(updateAttendance, 5000);
setInterval(updateStatus, 10000);

updateAttendance();
updateStatus();
</script>
</body>
</html>
